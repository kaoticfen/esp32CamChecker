services:
  hub:
    build: ./hub
    image: esp32camchecker-hub
    container_name: esp32cam-hub
    restart: unless-stopped

    # Host networking, for two reasons that both matter here:
    #   * cameras reach the hub with their real LAN source address, instead of
    #     Docker's userland proxy rewriting it to the bridge gateway
    #   * the hub reaches cameras on the LAN directly, with no extra hop
    # Swap to the bridge block below if you would rather publish a single port.
    network_mode: host

    # --- bridge alternative -------------------------------------------------
    # network_mode: bridge
    # ports:
    #   - "8080:8080"     # or "8443:8443" when TLS_CERT_FILE is set
    # ------------------------------------------------------------------------

    env_file:
      - .env

    volumes:
      # SQLite database, session secret, device tokens. Keep this backed up:
      # losing it means re-pairing every camera.
      - ./data:/data
      # mkcert output. Drop the mount if you are not terminating TLS here.
      - ./certs:/certs:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
