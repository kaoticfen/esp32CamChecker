; ESP32-CAM Checker -- AI Thinker ESP32-CAM firmware
;
; Flash with the ESP32-CAM-MB shield attached (it handles auto-reset, so no
; IO0 jumper is needed):
;   pio run -e cam -t upload
;   pio device monitor

[platformio]
default_envs = cam

[env:cam]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino

; Two ~1.9MB app slots so OTA works without ever reflashing over USB again.
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 460800

build_flags =
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DCORE_DEBUG_LEVEL=2
	-DFW_VERSION='"0.1.0"'

lib_deps =
	tzapu/WiFiManager@^2.0.17
	bblanchon/ArduinoJson@^7.2.0
